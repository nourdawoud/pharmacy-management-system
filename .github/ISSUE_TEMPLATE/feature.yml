name: Feature request
description: Propose a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the feature accomplish?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Suggested owner
