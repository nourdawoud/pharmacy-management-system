{% extends "base.html" %}{% block title %}Edit medicine{% endblock %}{% block content %}<h1>Edit medicine</h1><section class="panel narrow"><form method="post" class="form-grid"><label class="full">Name<input name="name" value="{{ medicine.name }}" required></label><label>Category<input name="category" value="{{ medicine.category }}"></label><label>Barcode<input name="barcode" value="{{ medicine.barcode or '' }}"></label><label>Unit price<input name="unit_price" type="number" min="0" step=".01" value="{{ medicine.unit_price }}" required></label><label>Quantity<input name="quantity" type="number" min="0" value="{{ medicine.quantity }}" required></label><label>Reorder level<input name="reorder_level" type="number" min="0" value="{{ medicine.reorder_level }}" required></label><label>Expiry<input name="expiry_date" type="date" value="{{ medicine.expiry_date or '' }}"></label><button class="primary">Save changes</button></form></section>{% endblock %}
