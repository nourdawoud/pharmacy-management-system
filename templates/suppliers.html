{% extends "base.html" %}{% block title %}Suppliers{% endblock %}{% block content %}<h1>Suppliers</h1><div class="two-col align-start"><section class="panel"><h2>Add supplier</h2><form method="post" class="stack"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Address<input name="address"></label><button class="primary">Save supplier</button></form></section><section class="panel"><h2>Supplier directory</h2><table><thead><tr><th>Name</th><th>Contact</th><th>Address</th></tr></thead><tbody>{% for s in suppliers %}<tr><td>{{ s.name }}</td><td>{{ s.phone }}<br>{{ s.email }}</td><td>{{ s.address }}</td></tr>{% else %}<tr><td colspan="3">No suppliers yet.</td></tr>{% endfor %}</tbody></table></section></div>{% endblock %}
