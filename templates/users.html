{% extends "base.html" %}{% block title %}User management{% endblock %}{% block content %}<h1>User management</h1><div class="two-col align-start"><section class="panel"><h2>Create user</h2><form method="post" class="stack"><label>Username<input name="username" required></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option value="employee">Employee</option><option value="admin">Admin</option></select></label><button class="primary">Create account</button></form></section><section class="panel"><h2>Existing users</h2><table><thead><tr><th>Username</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td></tr>{% endfor %}</tbody></table></section></div>{% endblock %}
